services:
  web:
    image: mygamelist-web:dev
    build:
      context: .
      dockerfile: Dockerfile.dev
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "127.0.0.1:${WEB_PORT:-5174}:5173"
    volumes:
      - ./src:/app/src:ro,Z
      - ./public:/app/public:ro,Z
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 10s
      timeout: 3s
      retries: 10
